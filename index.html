<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="styles.css">
        <title>Calculadora JS</title>
    </head>
    <body>
        <div class="calculadora">
            <div class="calculadora__resultado">
                <span class="resultado">0</span>
            </div>
            <div class="calculadora__botones">
                <button class="numeros">1</button>
                <button class="numeros">2</button>
                <button class="numeros">3</button>
                <button class="operadores dividir">/</button>
                <button class="numeros">4</button>
                <button class="numeros">5</button>
                <button class="numeros">6</button>
                <button class="operadores multiplicar">*</button>
                <button class="numeros">7</button>
                <button class="numeros">8</button>
                <button class="numeros">9</button>
                <button class="operadores restar">-</button>
                <button class="limpiar">C</button>
                <button class="numeros">0</button>
                <button class="igual">=</button>
                <button class="operadores sumar">+</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
